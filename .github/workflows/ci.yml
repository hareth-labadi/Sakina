# Checks every pull request into dev or main, and every push to them.
# Branch protection requires the two job names below ("checks" and "docker"), so keep them stable.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Translations in sync
        run: npm run check:i18n
      # next build also type-checks; it generates the route types tsc needs below.
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm run audit

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: docker build -t sakina-web:ci .
