# Weekly update PRs for npm packages, the Docker base images and the GitHub Actions used in CI,
# for both the web app (/) and the API (/backend).
# Minor and patch npm updates arrive grouped in one PR; major versions come one by one.
version: 2
updates:
  - package-ecosystem: npm
    directories: [/, /backend]
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /backend]
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
