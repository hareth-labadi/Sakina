# Weekly update PRs for npm packages, the Docker base image and the GitHub Actions used in CI.
# Minor and patch npm updates arrive grouped in one PR; major versions come one by one.
# Updates go to dev like any other change, and reach main with the next release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
