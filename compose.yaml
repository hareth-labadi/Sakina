# Full stack, production builds.  Start: docker compose up --build   ·   Stop: docker compose down
# Needs a .env next to this file with POSTGRES_PASSWORD (copy .env.compose.example).
# Day-to-day development uses compose.dev.yaml + `npm run dev` instead.
#
# Only "web" is reachable from outside (port 3000). It forwards /api/* to "api" over the internal
# network, so the browser talks to one origin (no CORS, first-party cookies). The API and the
# database have no published ports.

services:
  web:
    build:
      context: .
      args:
        # Where the browser calls the API: /api on this same origin, forwarded to "api" below.
        NEXT_PUBLIC_API_URL: /api
        API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://sakina:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/sakina
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Sakina <no-reply@sakina.invalid>}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    # no "ports": only reachable from other containers

  # One-off: applies pending migrations, then exits. The API starts only if it succeeded.
  migrate:
    build: ./backend
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://sakina:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/sakina
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sakina
      POSTGRES_DB: sakina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakina"]
      interval: 5s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # no "ports": the database is never exposed to the host or internet

volumes:
  db-data:
