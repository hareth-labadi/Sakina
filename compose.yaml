# Local stack.  Start: docker compose up --build   ·   Stop: docker compose down
#
# One container per service. Today only "web" exists; the commented services show where the
# backend and database go, so the browser talks to a single origin (no CORS, first-party cookies).

services:
  web:
    build:
      context: .
      args:
        # Empty = mock data. Later: the public URL the BROWSER uses to reach the API.
        NEXT_PUBLIC_API_URL: ""
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

